version: 2

models:
  - name: fct_play
    description: "Play-level fact table (1 row per play). Primary key is play_key, built from game_id, play_id, and drive."
    columns:
      - name: play_key
        description: "Stable play-level unique key built from game_id, play_id, and drive."
        data_tests:
          - not_null
          - unique

      - name: game_id
        description: "Game identifier."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_game')
                field: game_id

      - name: play_id
        description: "Play identifier within a game."
        data_tests:
          - not_null

      - name: offense_franchise_id
        description: "Offense franchise_id derived from posteam via dim_team_code."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_franchise')
                field: franchise_id

      - name: defense_franchise_id
        description: "Defense franchise_id derived from defteam via dim_team_code."
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_franchise')
                field: franchise_id
