version: 2

models:
  - name: fct_drive
    description: "Drive-level fact table (1 row per game_id and drive) aggregated from fct_play."
    columns:
      - name: drive_key
        description: "Stable drive-level unique key built from game_id and drive."
        data_tests:
          - not_null
          - unique

      - name: game_id
        description: "Game identifier."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_game')
                field: game_id

      - name: drive
        description: "Drive number within a game."
        data_tests:
          - not_null

      - name: offense_franchise_id
        description: "Offense franchise_id for the drive."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_franchise')
                field: franchise_id
